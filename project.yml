name: CalWidget
options:
  bundleIdPrefix: com.jack.calwidget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""

targets:
  CalWidget:
    type: application
    platform: iOS
    sources:
      - path: CalWidget
    info:
      path: CalWidget/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        CFBundleDisplayName: CalWidget
        NSCalendarsFullAccessUsageDescription: "CalWidget은 홈 화면 위젯과 앱 화면에 일정을 표시하기 위해 캘린더 접근이 필요합니다. 일정 데이터는 기기 외부로 전송되지 않습니다."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.jack.calwidget
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: CalWidgetExtension

  CalWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CalWidgetExtension
    info:
      path: CalWidgetExtension/Info.plist
      properties:
        NSCalendarsFullAccessUsageDescription: "위젯에 일정을 표시하기 위해 캘린더 접근이 필요합니다. 일정 데이터는 기기 외부로 전송되지 않습니다."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.jack.calwidget.widget
